# yugaktsent.neeklo.ru — ЮгАкцент (NestJS API + Vite SPA)
# SSL cert already exists for this domain.

server {
    listen 443 ssl http2;
    server_name yugaktsent.neeklo.ru;

    ssl_certificate /etc/letsencrypt/live/yugaktsent.neeklo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yugaktsent.neeklo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/ld+json
        application/xml application/xml+rss application/manifest+json
        image/svg+xml;

    # --- API (NestJS, PM2 yugaktsent-lg-api) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /docs {
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Persistent uploads ---
    location ^~ /uploads/ {
        alias /srv/yugaktsent-lg/uploads/;
        access_log off;
        # Имена файлов не меняются при перезаливке, поэтому месячный кэш
        # оставлял у вернувшихся посетителей старые тяжёлые копии.
        # Сутки свежести, дальше — фоновая перепроверка.
        expires off;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # --- SPA: собранный фронтенд ---
    location ^~ /assets/ {
        root /var/www/yugaktsent-lg/apps/web/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Статика в корне dist: логотип, og-картинка, иконки, шрифты ---
    location ~* ^/[^/]+\.(png|jpe?g|webp|svg|ico|woff2?)$ {
        root /var/www/yugaktsent-lg/apps/web/dist;
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        root /var/www/yugaktsent-lg/apps/web/dist;
        # Без $uri/: в dist есть каталог news с обложками новостей, и проба
        # каталога уводила маршрут /news приложения в 403 вместо страницы.
        # Файлы внутри (/news/covers/...) отдаются первым условием.
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    access_log /var/log/nginx/yugaktsent.neeklo.ru.access.log;
    error_log  /var/log/nginx/yugaktsent.neeklo.ru.error.log warn;
}

server {
    if ($host = yugaktsent.neeklo.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name yugaktsent.neeklo.ru;
    return 404;
}

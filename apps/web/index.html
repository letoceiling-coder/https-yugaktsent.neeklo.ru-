<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ЮгАкцент · новостройки и недвижимость в Анапе</title>
    <meta name="description" content="Каталог новостроек и квартир в Анапе. Подбор, карта, консультация специалистов ЮгАкцент.">
    <meta name="author" content="ЮгАкцент" />
    <meta property="og:site_name" content="ЮгАкцент" />
    <meta property="og:url" content="https://yugaktsent.neeklo.ru/" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-yugaktsent.png" />

    <!-- Фото комплексов приходят с хостов Profitbase: рукопожатие TLS начинаем
         заранее, иначе первая картинка экрана ждёт его целиком.
         Список повторяет хосты активных фидов (админка → Фиды). -->
    <link rel="preconnect" href="https://pb2093.profitbase.ru" crossorigin />
    <link rel="preconnect" href="https://pb19399.profitbase.ru" crossorigin />
    <link rel="dns-prefetch" href="https://pb16100.tochno.profitbase.ru" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ЮгАкцент · новостройки и недвижимость в Анапе">
    <meta property="og:description" content="Каталог новостроек и квартир в Анапе. Подбор, карта, консультация.">
    <meta property="og:image" content="https://yugaktsent.neeklo.ru/og-yugaktsent.jpg">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ЮгАкцент · новостройки и недвижимость в Анапе">
    <meta name="twitter:description" content="Каталог новостроек и квартир в Анапе. Подбор, карта, консультация.">
    <meta name="twitter:image" content="https://yugaktsent.neeklo.ru/og-yugaktsent.jpg">
    <style>
      /* Первый кадр до загрузки бандла: одностраничное приложение иначе
         держит белый экран до разбора скриптов. React заменит содержимое
         #root целиком, доводить эту заглушку до пикселя не нужно. */
      :root { color-scheme: light; }
      html, body { margin: 0; background: #ffffff; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .boot-header {
        display: flex; align-items: center; height: 64px; gap: 12px;
        padding: 0 16px; border-bottom: 1px solid #e6e8eb; background: #fff;
      }
      .boot-header img { height: 40px; width: auto; }
      .boot-hero {
        height: calc(100svh - 64px); min-height: 520px; background: #1a1d21;
        display: flex; align-items: center; padding: 0 16px;
      }
      .boot-lines { width: min(720px, 100%); }
      .boot-line {
        height: 18px; border-radius: 6px; margin-bottom: 14px;
        background: linear-gradient(90deg, #2a2e34 25%, #343941 37%, #2a2e34 63%);
        background-size: 400% 100%; animation: boot-shimmer 1.4s ease-in-out infinite;
      }
      .boot-line.lg { height: 44px; width: 68%; margin-bottom: 22px; }
      .boot-line.sm { width: 46%; }
      @keyframes boot-shimmer { 0% { background-position: 100% 0 } 100% { background-position: 0 0 } }
      @media (prefers-reduced-motion: reduce) { .boot-line { animation: none } }
      @media (min-width: 1024px) {
        .boot-header { height: 72px; padding: 0 32px; }
        .boot-hero { height: calc(100svh - 72px); padding: 0 32px; }
      }
    </style>
</head>

  <body>
    <div id="root">
      <div class="boot-header">
        <img src="/logo-yug-aktsent.png" alt="ЮгАкцент" width="194" height="48" fetchpriority="high" />
      </div>
      <div class="boot-hero" aria-hidden="true">
        <div class="boot-lines">
          <div class="boot-line sm"></div>
          <div class="boot-line lg"></div>
          <div class="boot-line"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
